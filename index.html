<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabFlow · Gestión de Solicitudes de Laboratorio</title>
    <meta name="description" content="LabFlow: gestión de solicitudes de compra, recepción de pedidos, inventario y gastos del laboratorio." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="logo-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          // GitHub Pages: /LabFlow/; Vercel y local: /
          const basePath = window.location.pathname.includes("/LabFlow/") ? "/LabFlow/" : "/";
          const swPath = basePath + "firebase-messaging-sw.js";
          navigator.serviceWorker.register(swPath, { scope: basePath }).catch((error) => {
            console.error("Service Worker registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
